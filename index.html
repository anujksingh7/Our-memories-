  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Memories ❤️</title>

    <style>
    *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; -webkit-tap-highlight-color: transparent; }

    /* --- BLUR & BLACK EFFECT FOR BACKGROUND --- */
    body {
        position: relative;
        min-height: 100vh;
        padding: 15px;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('https://i.ibb.co/B22mSG3K/8c1c38a1-832e-4a66-90cb-909e07240520.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(6px); 
        -webkit-filter: blur(6px);
        transform: scale(1.1); 
        z-index: -2;
    }

    body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4); 
        z-index: -1;
    }

    h1{ text-align:center; color:white; margin-bottom:20px; text-shadow:2px 2px 8px rgba(0,0,0,0.5); font-size: 1.8rem; position: relative; }
    .music{ text-align:center; margin-bottom:25px; position: relative; }
    audio{ width:100%; max-width:300px; }
    .gallery{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; position: relative; }

    .card{ 
        background: rgba(255, 255, 255, 0.15); 
        backdrop-filter: blur(8px); 
        -webkit-backdrop-filter: blur(8px); 
        border-radius: 15px; 
        overflow: hidden; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
        transition: transform 0.3s ease, box-shadow 0.3s ease; 
        cursor: pointer; 
        user-select: none; 
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .card:hover, .card:active { 
        transform: scale(1.04); 
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.7); 
    }

    .card img{ width:100%; height:180px; object-fit:cover; display:block; }
    .caption{ padding:8px; text-align:center; color:white; font-weight:bold; font-size: 0.9rem; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }

    /* --- Advanced Lightbox with 3D Flip Effect --- */
    .lightbox-overlay { 
        display: none; 
        position: fixed; 
        z-index: 1000; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        background: rgba(0, 0, 0, 0.95); 
        backdrop-filter: blur(8px); 
        -webkit-backdrop-filter: blur(8px); 
        flex-direction: column;
        justify-content: center; 
        align-items: center; 
    }

    .flip-container {
        width: 90%;
        max-width: 350px;
        height: 430px; /* Thoda height badhaya h text fitting ke liye */
        perspective: 1000px; 
        margin-bottom: 20px;
    }

    .flip-card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flip-card-inner.flipped {
        transform: rotateY(180deg);
    }

    .flip-front, .flip-back {
        width: 100%;
        height: 100%;
        position: absolute;
        backface-visibility: hidden; 
        -webkit-backface-visibility: hidden;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        overflow: hidden;
    }

    .flip-front img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .flip-back {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.3);
        color: white;
        transform: rotateY(180deg);
        display: flex;
        flex-direction: column;
        justify-content: space-between; /* Content ko ache se arrange karne ke liye */
        align-items: center;
        padding: 20px;
        text-align: center;
    }

    .flip-back h3 {
        font-size: 1.4rem;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        margin-bottom: 5px;
    }

    /* Surprise Text Style (Middle) */
    .surprise-text {
        font-size: 1.1rem;
        color: #ffeb3b; /* Halka yellow shade taaki highlight ho */
        font-weight: bold;
        margin: 8px 0;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }

    /* Story Text Scrollable if long */
    .story-container {
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
        padding: 5px;
        margin-bottom: 5px;
    }

    .flip-back p {
        font-size: 0.95rem;
        line-height: 1.4;
        font-weight: 500;
    }

    /* Husband Credit Text Style (Last) */
    .husband-credit {
        font-size: 0.9rem;
        font-style: italic;
        color: rgba(255, 255, 255, 0.85);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
        padding-top: 8px;
        margin-top: 5px;
    }

    .btn-container {
        display: flex;
        gap: 15px;
    }

    .lightbox-btn {
        background: white;
        color: #ff69b4;
        border: none;
        padding: 10px 20px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        transition: 0.2s;
    }

    .lightbox-btn.close-btn {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.4);
    }
    </style>
</head>
<body>

<div id="lightbox" class="lightbox-overlay">
    <div class="flip-container">
        <div id="flip-card-inner" class="flip-card-inner">
            <div class="flip-front">
                <img id="lightbox-img" src="">
            </div>
            <div class="flip-back">
                <h3 id="info-title">Our Story</h3>
                
                <div class="surprise-text">kaisa laga apke pati ja surprise 🙈🤌🏻🥹</div>

            </div>

    </div>
    
    <div class="btn-container">
        <button id="flip-btn" class="lightbox-btn">🔄 Flip Photo</button>
        <button id="close-btn" class="lightbox-btn close-btn">❌ Close</button>
    </div>
</div>

<script>
    const galleryCards = document.querySelectorAll('.card');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const flipCardInner = document.getElementById('flip-card-inner');
    const flipBtn = document.getElementById('flip-btn');
    const closeBtn = document.getElementById('close-btn');
    const infoText = document.getElementById('info-text');
    const infoTitle = document.getElementById('info-title');

    galleryCards.forEach(card => {
        card.addEventListener('click', () => {
            const img = card.querySelector('img');
            const text = card.getAttribute('data-info'); 
            const caption = card.querySelector('.caption').innerText;

            lightboxImg.src = img.src; 
            infoText.innerText = text; 
            infoTitle.innerText = caption;

            flipCardInner.classList.remove('flipped'); 
            lightbox.style.display = 'flex'; 
        });
    });

    flipBtn.addEventListener('click', (e) => {
        e.stopPropagation(); 
        flipCardInner.classList.toggle('flipped'); 
    });

    closeBtn.addEventListener('click', () => {
        lightbox.style.display = 'none';
    });
</script>

</body>
